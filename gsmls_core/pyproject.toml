[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "gsmls"
version = "0.6.0"
description = "Core GSMLS packages to be used in the Airflow pipeline"

dependencies = [
    "beautifulsoup4==4.14.2",
    "kafka-python==2.2.15",
    "pandas==2.3.3",
    "pendulum==3.1.0",
    "psycopg2-binary",
    "pypdf==6.4.1",
    "pymongo==4.15.1",
    "pyspark==4.0.0",
    "requests==2.32.5",
    "selenium==4.13.0",
    "SQLAlchemy==2.0.43",
    "tqdm==4.67.1",
    "xlrd==2.0.2",
    "openpyxl==3.1.5",
    "boto3==1.42.29",
    "docker==7.1.0",
    "requests-futures==1.0.2"
]

